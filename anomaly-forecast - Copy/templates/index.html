<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anomaly & Forecasting Framework</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <style>
        /* --- Common Styles (from both files) --- */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(120deg, #e0f7fa, #f1f8ff);
            margin: 0;
            padding: 0;
        }

        .container {
            padding: 40px;
            max-width: 100%;
            margin: auto;
        }

        .header {
            background: linear-gradient(90deg, #1e3c72, #2a5298);
            color: white;
            padding: 30px 40px;
            font-size: 34px;
            font-weight: 600;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            margin-bottom: 40px;
        }

        .sections-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 30px;
            justify-items: center;
            margin-top: 20px;
        }

        .section {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 25px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid rgba(0, 0, 0, 0.08);
        }

        .section:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.15);
        }

        .section h2 {
            font-size: 22px;
            border-bottom: 2px solid #1976d2;
            padding-bottom: 8px;
            margin-bottom: 25px;
            color: #1a237e;
        }

        label {
            font-weight: 500;
            color: #333;
            margin-bottom: 6px;
            display: block;
        }

        input[type="text"],
        select,
        .date-picker {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #cfd8dc;
            margin-bottom: 18px;
            font-size: 16px;
            background: #f9f9f9;
            transition: border 0.3s ease;
        }

        input[type="text"]:focus,
        select:focus,
        .date-picker:focus {
            border-color: #1976d2;
            outline: none;
        }

        input[type="checkbox"],
        input[type="radio"] {
            margin-right: 8px;
        }

        .metric-group {
            padding: 10px;
            background: #f0f7ff;
            border-radius: 10px;
            border: 1px dashed #90caf9;
            margin-bottom: 10px;
        }

        #customDateRange {
            display: none;
        }

        canvas {
            background: #ffffff;
            border-radius: 10px;
            margin-top: 10px;
        }

        .modelName {
            font-size: 18px;
            font-weight: 600;
            color: #1a237e;
            margin-top: 20px;
        }

        @media screen and (max-width: 900px) {
            .sections-container {
                grid-template-columns: 1fr;
                /* Stack panels on small screens */
            }
        }

        /* Tab Styles */
        .tab {
            overflow: hidden;
            border-bottom: 2px solid #ddd;
            /* Add bottom border to the tab container */
        }

        .tab button {
            background-color: inherit;
            float: left;
            border: none;
            outline: none;
            cursor: pointer;
            padding: 14px 16px;
            transition: 0.3s;
            font-size: 17px;
        }

        .tab button:hover {
            background-color: #ddd;
        }

        .tab button.active {
            background-color: #ccc;
        }

        .tabcontent {
            display: none;
            padding: 6px 12px;
            border-top: none;
            /* Remove top border to connect with tabs */
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">✨ Anomaly & Forecasting Framework for TSDB</div>

        <div class="tab">
            <button class="tablinks active" onclick="openTab(event, 'Train')">Train Model</button>
            <button class="tablinks" onclick="openTab(event, 'Detect')">Detect/Forecast</button>
        </div>

        <div id="Train" class="tabcontent">
            <div class="sections-container">
                <div class="section">
                    <h2>Analysis</h2>
                    <label for="trainAnalysisType">Method:</label>
                    <select id="trainAnalysisType">
                        <option value="anomaly">Anomaly</option>
                        <option value="forecast">Forecast</option>
                    </select>

                    <label for="trainAppId">App ID:</label>
                    <input type="text" id="trainAppId" />

                    <label for="trainDetectorId">Detector Name:</label>
                    <input type="text" id="trainDetectorId" />

                    <label>Data Sources:</label>
                    <div>
                        <input type="checkbox" name="trainSource" value="splunk" /> Splunk
                        <input type="checkbox" name="trainSource" value="appd" /> AppD
                        <input type="checkbox" name="trainSource" value="elastic" /> Elastic
                        <input type="checkbox" name="trainSource" value="prometheus" /> Prometheus
                        <input type="checkbox" name="trainSource" value="autosys" /> Autosys
                    </div>
                </div>

                <div class="section" id="dataFeedSection">
                    <h2>Data Feed</h2>

                    <label for="trainSplunkQuery">Splunk Query:</label>
                    <textarea id="trainSplunkQuery" rows="4" placeholder="Enter your Splunk query here..."></textarea>

                    <label for="trainPrometheusEndpoint">Prometheus API Metric Endpoint:</label>
                    <input type="text" id="trainPrometheusEndpoint"
                        placeholder="Enter Prometheus API Metric Endpoint" />

                    <label for="trainAppdApiEndpoint">AppD API Metric Endpoint:</label>
                    <input type="text" id="trainAppdApiEndpoint" placeholder="Enter AppD API Metric Endpoint" />

                    <label for="trainAutosysApiEndpoint">Autosys API Metric Endpoint:</label>
                    <input type="text" id="trainAutosysApiEndpoint"
                        placeholder="Enter Autosys API Metric Endpoint" />

                    <label for="trainElasticApiEndpoint">Elastic API Metric Endpoint:</label>
                    <input type="text" id="trainElasticApiEndpoint"
                        placeholder="Enter Elastic API Metric Endpoint" />

                    <label for="trainDuration">Duration (How much data to fetch):</label>
                    <select id="trainDuration">
                        <option value="30days">Last 30 Days</option>
                        <option value="6months">Last 6 Months</option>
                    </select>

                    <label for="trainInterval">Interval (Model Run Frequency):</label>
                    <select id="trainInterval">
                        <option value="1hr">Every 1 Hour</option>
                        <option value="30min">Every 30 Minutes</option>
                        <option value="1day">Every 1 Day</option>
                        <option value="1min">Every 1 Minutes</option>
                    </select>

                    <button id="trainButton"
                        style="margin-top: 20px; padding: 10px 20px; background-color: #1976d2; color: white; border: none; border-radius: 5px; cursor: pointer;">
                        Train Model
                    </button>
                </div>

                <div class="section">
                    <h2>Metrics</h2>
                    <div id="trainMetricsContainer"></div>
                </div>
            </div>
        </div>

        <div id="Detect" class="tabcontent">
            <div class="sections-container">
                <div class="section">
                    <h2>Analysis</h2>
                    <label for="detectAnalysisType">Method:</label>
                    <select id="detectAnalysisType">
                        <option value="anomaly">Anomaly</option>
                        <option value="forecast">Forecast</option>
                    </select>

                    <label for="detectAppId">App ID:</label>
                    <input type="text" id="detectAppId" />

                    <label for="modelID">Model ID:</label>
                    <select id="modelID">
                        <option value="">Select modelID</option>
                        <!-- Options will be dynamically populated -->
                    </select>

                    <label for="detectTimeRange">Time Range:</label>
                    <select id="detectTimeRange">
                        <option value="24hr">Last 24 Hours</option>
                        <option value="3days">Last 3 Days</option>
                        <option value="custom">Custom Range</option>
                    </select>

                    <div id="detectCustomDateRange">
                        <label for="detectStartDate">From:</label>
                        <input type="text" id="detectStartDate" class="date-picker" />
                        <label for="detectEndDate">To:</label>
                        <input type="text" id="detectEndDate" class="date-picker" />
                    </div>

                    <label>Data Sources:</label>
                    <div>
                        <input type="checkbox" name="detectSource" value="splunk" /> Splunk
                        <input type="checkbox" name="detectSource" value="appd" /> AppD
                        <input type="checkbox" name="detectSource" value="elastic" /> Elastic
                        <input type="checkbox" name="detectSource" value="prometheus" /> Prometheus
                        <input type="checkbox" name="detectSource" value="grafana" /> Grafana
                        <input type="checkbox" name="detectSource" value="autosys" /> Autosys
                    </div>
                </div>

                <div class="section">
                    <h2>Metrics</h2>
                    <div id="detectMetricsContainer"></div>
                </div>

                <div class="section">
                    <h2>Model</h2>
                    <div id="detectModeSection" style="display: none">
                        <label for="detectModeSelect">Select Mode:</label>
                        <select id="detectModeSelect">
                            <option value="model1">Model 1</option>
                            <option value="model2">Model 2</option>
                        </select>
                    </div>
                    <canvas id="detectChartCanvas" width="600" height="400"></canvas>
                    <div class="modelName" id="detectModelName"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/a076d05399.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
    <script>
        // Tab handling logic
        function openTab(evt, tabName) {
            let i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";
        }

        // Initialize the "Train" tab as active on page load
        document.querySelector('.tablinks').click();

        $(function () {
            $("#trainStartDate, #trainEndDate, #detectStartDate, #detectEndDate").datepicker({
                dateFormat: "yy-mm-dd",
                onSelect: function () {
                    const date = $(this).val();
                    const currentTime = new Date().toLocaleTimeString();
                    $(this).val(date + ' ' + currentTime);
                }
            });

            // Toggle custom date ranges
            $('#trainTimeRange').change(function () {
                $('#trainCustomDateRange').toggle(this.value === 'custom');
            });

            $('#detectTimeRange').change(function () {
                $('#detectCustomDateRange').toggle(this.value === 'custom');
            });

            // --- Metric Selection Logic ---
            const metricMap = {
                splunk: ['Latency', 'Volume', 'Error Rate'],
                appd: ['Latency', 'Volume', 'Error Rate'],
                elastic: ['Latency', 'Volume', 'Error Rate'],
                prometheus: ['CPU', 'Memory', 'Disk'],
                autosys: [
                    'Unexpected Job Failures',
                    'Job Not Started on Schedule',
                    'Job Runs Longer Than Expected',
                    'Job Runs Too Quickly',
                    'Job Dependency Violations',
                    'High Retries/Restarts',
                    'Resource Utilization Anomalies'
                ]
            };

            // Train Tab Metrics
            const trainSourceCheckboxes = document.querySelectorAll("input[name='trainSource']");
            const trainMetricsContainer = document.getElementById('trainMetricsContainer');

            trainSourceCheckboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    trainMetricsContainer.innerHTML = '';
                    trainSourceCheckboxes.forEach(box => {
                        if (box.checked) {
                            const metrics = metricMap[box.value] || [];
                            metrics.forEach(metric => {
                                const id = `train_${box.value}_${metric}`.replace(/\s+/g, '_'); // Prefix with "train_"
                                const groupHTML = `
                                    <div class="metric-group">
                                        <label><strong>Primary:</strong> <input type='radio' name='trainPrimary' value='${id}' data-label='${metric} (${box.value})' /> ${metric} (${box.value})</label><br/>
                                        <label><strong>Supporting:</strong> <input type='checkbox' name='trainSupporting' value='${id}' /> ${metric} (${box.value})</label>
                                    </div>
                                `;
                                trainMetricsContainer.insertAdjacentHTML('beforeend', groupHTML);
                            });
                        }
                    });
                });
            });

            // Detect Tab Metrics
            const detectSourceCheckboxes = document.querySelectorAll("input[name='detectSource']");
            const detectMetricsContainer = document.getElementById('detectMetricsContainer');
            const detectModelNameElement = document.getElementById('detectModelName');

            detectSourceCheckboxes.forEach(cb => {
                cb.addEventListener('change', () => {
                    detectMetricsContainer.innerHTML = '';
                    detectSourceCheckboxes.forEach(box => {
                        if (box.checked) {
                            const metrics = metricMap[box.value] || [];
                            metrics.forEach(metric => {
                                const id = `detect_${box.value}_${metric}`.replace(/\s+/g, '_');  // Prefix with "detect_"
                                const groupHTML = ` 
                                    <div class="metric-group">
                                      <label><strong>Primary:</strong> <input type='radio' name='detectPrimary' value='${id}' data-label='${metric} (${box.value})' /> ${metric} (${box.value})</label><br/>
                                      <label><strong>Supporting:</strong> <input type='checkbox' name='detectSupporting' value='${id}' /> ${metric} (${box.value})</label>
                                    </div>
                                  `;
                                detectMetricsContainer.insertAdjacentHTML('beforeend', groupHTML);
                            });
                        }
                    });
                });
            });

            detectMetricsContainer.addEventListener('change', () => {
                const primaryMetric = document.querySelector("input[name='detectPrimary']:checked");
                const selectedDate = document.getElementById("detectStartDate").value || "No Date";

                const selectedSecondaryMetrics = Array.from(
                    document.querySelectorAll("input[name='detectSupporting']:checked")
                ).map(input => input.value);

                if (primaryMetric) {
                    let modelName = `${selectedDate}-${primaryMetric.dataset.label}`;

                    if (selectedSecondaryMetrics.length > 0) {
                        modelName += '-' + selectedSecondaryMetrics
                            .map(id => {
                                const label = document.querySelector(`input[value="${id}"]`).parentElement.querySelector('label').innerText.split(":")[1].trim();
                                return `${label}`;
                            })
                            .join('-');
                    }

                    detectModelNameElement.textContent = `Generated Model Name: ${modelName}`;
                    console.log("Generated Model Name: ", modelName);
                }

                // Placeholder chart rendering logic
                const ctx = document.getElementById('detectChartCanvas').getContext('2d');
                const chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['January', 'February', 'March', 'April', 'May'],
                        datasets: [{
                            label: 'Sample Dataset',
                            data: [65, 59, 80, 81, 56],
                            borderColor: 'rgba(75, 192, 192, 1)',
                            borderWidth: 1
                        }]
                    }
                });
            });
        });
    </script>
<script src="{{ url_for('static',filename='javascript/form.js') }}"></script>
</body>

</html>
