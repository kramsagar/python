<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anomaly and Forecasting Framework for TSDB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="bg-white text-gray-800 font-sans min-h-screen p-6">

  <!-- Page Header -->
  <header class="text-center mb-8">
    <h1 class="text-3xl font-bold text-blue-800 flex justify-center items-center gap-3">
      <i class="fa-solid fa-chart-line text-blue-700"></i>
      Anomaly and Forecasting Framework for TSDB
    </h1>
  </header>

  <!-- Sections Container -->
  <main class="grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- Analysis Section -->
    <section class="bg-white border rounded-2xl shadow-lg p-6 space-y-6">
      <h2 class="text-xl font-semibold text-blue-700">Analysis</h2>

      <!-- Top: Analysis Method -->
      <div class="border-b pb-4">
        <label for="analysis-method" class="block text-blue-700 font-medium mb-2">Analysis Method</label>
        <select id="analysis-method" class="w-full border rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="">Select Method</option>
          <option value="anomaly">Anomaly</option>
          <option value="forecast">Forecasting</option>
        </select>
      </div>

      <!-- Bottom: Data Sources -->
      <div>
        <h3 class="text-md font-semibold text-blue-700 mb-2">Data Sources</h3>
        <input type="text" placeholder="Enter API or data link" class="w-full mb-2 px-4 py-2 border rounded focus:ring-2 focus:ring-blue-300" />
        <input type="text" placeholder="Enter query (optional)" class="w-full mb-3 px-4 py-2 border rounded focus:ring-2 focus:ring-blue-300" />
        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">
          Load Data
        </button>
      </div>
    </section>

    <!-- Metrics Section -->
    <section class="bg-white border rounded-2xl shadow-lg p-6 space-y-4">
      <h2 class="text-xl font-semibold text-blue-700">Metrics</h2>
      <label for="metric-select" class="block text-blue-700">Select Metric</label>
      <select id="metric-select" class="w-full border rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <option value="">Select Metric</option>
        <option value="cpu">CPU Usage</option>
        <option value="memory">Memory Usage</option>
        <option value="latency">Latency</option>
      </select>
      <label for="time-range" class="block text-blue-700 mt-4">Time Range</label>
      <input type="datetime-local" class="w-full border rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <input type="datetime-local" class="w-full border rounded mt-2 px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
    </section>

    <!-- Graph Section -->
    <section class="bg-white border rounded-2xl shadow-lg p-6 space-y-4">
      <h2 class="text-xl font-semibold text-blue-700">Model Output</h2>
      <div class="w-full h-64 border rounded bg-gray-100 flex items-center justify-center text-gray-500">
        Graph will be shown here
      </div>
    </section>

  </main>
</body>
</html>
